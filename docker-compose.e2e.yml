version: '3.9'

services:
  neo4j:
    image: neo4j:5.22
    container_name: graph-starz-e2e-neo4j
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: 'neo4j/testpassword'
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_memory_heap_initial_size: 1G
      NEO4J_server_memory_heap_max_size: 1G
    volumes:
      - neo4j_e2e_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: graph-starz-e2e-fake-gcs
    ports:
      - '4443:4443'
    command:
      - '-scheme'
      - 'http'
      - '-port'
      - '4443'
      - '-public-host'
      - 'localhost:4443'
      - '-external-url'
      - 'http://localhost:4443'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:4443/_internal/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neo4j_e2e_data:
