<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Starz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#020617', // Slate 950 (Darker)
              surface: '#1e293b', // Slate 800
              primary: '#6366f1', // Indigo 500
              secondary: '#ec4899', // Pink 500
              accent: '#22d3ee', // Cyan 400
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'fade-in': 'fadeIn 0.5s ease-in forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      };
    </script>
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      body {
        background-color: #020617;
        color: #f8fafc;
        overflow: hidden; /* Prevent body scroll, handle in app */
      }

      /* Graph Specific Styles */
      .node-pulse {
        animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: center;
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
          opacity: 1;
        }
        70% {
          transform: scale(1.1);
          box-shadow: 0 0 0 20px rgba(99, 102, 241, 0);
          opacity: 0.8;
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
          opacity: 1;
        }
      }

      /* Floating particles animation */
      @keyframes float {
        0%, 100% {
          transform: translate3d(0, 0, 0) scale(1);
          opacity: 0.1;
        }
        25% {
          transform: translate3d(20px, -30px, 0) scale(1.2);
          opacity: 0.3;
        }
        50% {
          transform: translate3d(-15px, -60px, 0) scale(0.8);
          opacity: 0.2;
        }
        75% {
          transform: translate3d(25px, -90px, 0) scale(1.1);
          opacity: 0.25;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
